services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      CORS_ORIGINS: http://localhost:3000
      APP_NAME: linkbox-compose
      DATABASE_URL: sqlite:////data/links.db
    volumes:
      - linkbox-data:/data
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  linkbox-data:
    external: true
    name: linkbox-data
