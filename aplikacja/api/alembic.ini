; Konfiguracja Alembica — narzędzia do migracji bazy danych.
;
; Migracja to opisana w kodzie zmiana struktury bazy (nowa tabela, nowa
; kolumna, indeks). Dzięki nim struktura bazy jest wersjonowana razem
; z aplikacją: ta sama komenda daje tę samą bazę na każdej maszynie.
;
; Adresu bazy NIE MA w tym pliku — celowo. Alembic bierze go z tej samej
; zmiennej środowiskowej DATABASE_URL, co aplikacja (patrz alembic/env.py).
; Dwa źródła prawdy o adresie bazy to gwarancja, że kiedyś się rozjadą.

[alembic]
; Katalog ze skryptami migracji.
script_location = alembic

; Katalog dokładany do sys.path, żeby dało się zaimportować pakiet `app`.
; Kropka oznacza katalog, z którego uruchamiany jest alembic.
prepend_sys_path = .

; Szablon nazwy nowego pliku migracji: data + identyfikator + opis.
; Dzięki dacie na początku pliki układają się chronologicznie.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

; Strefa czasowa używana w nazwach plików migracji.
timezone = UTC


; ---------------------------------------------------------------------------
; Konfiguracja logowania Alembica (osobna od logowania aplikacji).
; ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-8s [alembic] %(name)s: %(message)s
